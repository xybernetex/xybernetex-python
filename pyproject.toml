[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xybernetex"
version = "0.1.0"
description = "A deterministic layer for Python agents (OpenAI Agents SDK, LangGraph): safety gate, acceptance contracts, ratchet and governor."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Xybernetex", email = "chris@xybernetex.com" }]
dependencies = []

[project.optional-dependencies]
openai-agents = ["openai-agents>=0.1"]
langgraph = ["langgraph>=1.0"]

[project.urls]
Homepage = "https://xybernetex.com"
Repository = "https://github.com/xybernetex/xybernetex-python"

[tool.setuptools.packages.find]
where = ["src"]
